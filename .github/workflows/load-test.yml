name: OCPP WAMP load test

# WampLoadTest is kept out of check (see ocpp-wamp/build.gradle.kts): its outcome depends on the throughput of the
# runner. It runs here nightly, and on demand, instead of gating pull requests.
on:
    schedule:
        -   cron: '0 2 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    load-test:

        concurrency: ocpp-load-test

        runs-on: ubuntu-latest

        timeout-minutes: 30

        steps:
            -   name: Set up JDK 21
                uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
                with:
                    java-version: '21'
                    distribution: 'temurin'

            -   name: Checkout IZIVIA OCPP toolkit library code from GH
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

            -   name: Run the WAMP load test
                run: ./gradlew :ocpp-wamp:loadTest
