name: OCPP CI

on:
    push:
        branches: [ "dev" ]
    pull_request:
        branches: [ "**" ]

permissions:
    contents: read

jobs:
    build:

        # One group per ref: a run only supersedes an older run of the same
        # branch or pull request, never the pending run of another one.
        concurrency:
            group: ocpp-ci-${{ github.ref }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}

        runs-on: ubuntu-latest

        steps:
            -   name: Set up JDK 21
                uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
                with:
                    java-version: '21'
                    distribution: 'temurin'

            -   name: Checkout IZIVIA OCPP toolkit library code from GH
                uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

            -   name: Test the CHANGELOG section extraction
                run: sh scripts/test-changelog-section.sh

            -   name: Build OCPP toolkit with Gradle
                run: ./gradlew build
